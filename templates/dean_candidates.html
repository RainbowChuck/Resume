<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Кандидаты на рассмотрении</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .nav-links {
      margin-bottom: 20px;
    }
    .nav-links a {
      margin-right: 15px;
      text-decoration: none;
      color: #007bff;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border: 1px solid #ddd;
    }
    th {
      background-color: #f5f5f5;
    }
    tr:hover {
      background-color: #f9f9f9;
    }
    .action-button {
      display: inline-block;
      padding: 6px 12px;
      background: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      margin-right: 5px;
    }
    .action-button:hover {
      background: #0056b3;
    }
    .accept-button {
        background-color: #28a745;
    }
    .reject-button {
        background-color: #dc3545;
    }
  </style>
</head>
<body>
  <div class="nav-links">
    <a href="/dashboard">← Назад</a>
  </div>

  <h2>Список кандидатов на утверждение</h2>

  <table>
    <tr>
      <th>Имя</th>
      <th>Email</th>
      <th>Телефон</th>
      <th>Статус</th>
      <th>Действия</th>
    </tr>
    {% for candidate in candidates %}
    <tr>
      <td>{{ candidate.name }}</td>
      <td>{{ candidate.email }}</td>
      <td>{{ candidate.phone }}</td>
      <td>{{ candidate.status }}</td>
      <td>
        <form action="/dean/candidates/{{ candidate.id }}/action" method="post" style="display: inline;">
            <button type="submit" name="action" value="accept" class="action-button accept-button">Утвердить</button>
        </form>
        <form action="/dean/candidates/{{ candidate.id }}/action" method="post" style="display: inline;">
            <button type="submit" name="action" value="reject" class="action-button reject-button">Отклонить</button>
        </form>
        <a href="/candidates/{{ candidate.id }}" class="action-button">Подробнее</a>
      </td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
