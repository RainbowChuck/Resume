<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Dean Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .nav-links {
            margin-bottom: 20px;
        }
        .nav-links a {
            margin-right: 15px;
            text-decoration: none;
            color: #007bff;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .dashboard-card {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 5px;
            text-align: center;
        }
        .dashboard-card h2 {
            margin-top: 0;
        }
        .dashboard-card a {
            display: inline-block;
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            text-decoration: none;
            margin-top: 10px;
        }
        .dashboard-card a:hover {
            background: #0056b3;
        }
        .pending-approvals {
            margin-top: 40px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 5px;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.9em;
            margin-left: 10px;
        }
        .status-approved {
            background: #28a745;
            color: white;
        }
        .status-pending {
            background: #ffc107;
            color: black;
        }
    </style>
</head>
<body>
    <div class="nav-links">
        <a href="/logout">Выйти</a>
    </div>
    <h1>Панель управления декана</h1>
    <p>Добро пожаловать, {{ user.username }}!</p>
    <div class="dashboard-grid">
        <div class="dashboard-card">
            <h2>Список кандидатов</h2>
            <p>Просмотр и финальное утверждение кандидатов</p>
            <a href="/dean/candidates">Просмотреть кандидатов</a>
        </div>
        <div class="dashboard-card">
            <h2>История поисковых запросов</h2>
            <p>Просмотр истории поисковых запросов</p>
            <a href="/history">Просмотреть историю</a>
        </div>
    </div>
</body>
</html>
