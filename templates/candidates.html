<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Кандидаты</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .nav-links {
      margin-bottom: 20px;
    }
    .nav-links a {
      margin-right: 15px;
      text-decoration: none;
      color: #007bff;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border: 1px solid #ddd;
    }
    th {
      background-color: #f5f5f5;
    }
    tr:hover {
      background-color: #f9f9f9;
    }
    .action-button {
      display: inline-block;
      padding: 6px 12px;
      background: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      margin-right: 5px;
    }
    .action-button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <div class="nav-links">
    <a href="/dashboard">← Назад</a>
    <a href="/search">Поиск</a>
    <a href="/history">История поиска</a>
  </div>

  <h2>Список кандидатов</h2>

  <table>
    <tr>
      <th>Имя</th>
      <th>Email</th>
      <th>Телефон</th>
      <th>Статус</th>
      <th>Действия</th>
    </tr>
    {% for candidate in candidates %}
    <tr>
      <td>{{ candidate.name }}</td>
      <td>{{ candidate.email or 'Не указан' }}</td>
      <td>{{ candidate.phone or 'Не указан' }}</td>
      <td>{{ candidate.status }}</td>
      <td>
        <a href="/candidates/{{ candidate.id }}" class="action-button">Подробнее</a>
      </td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
