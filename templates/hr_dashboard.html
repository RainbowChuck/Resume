<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>HR Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .nav-links {
            margin-bottom: 20px;
        }
        .nav-links a {
            margin-right: 15px;
            text-decoration: none;
            color: #007bff;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .dashboard-card {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 5px;
            text-align: center;
        }
        .dashboard-card h2 {
            margin-top: 0;
        }
        .dashboard-card a {
            display: inline-block;
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            text-decoration: none;
            margin-top: 10px;
        }
        .dashboard-card a:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="nav-links">
        <a href="/logout">Выйти</a>
    </div>
    <h1>HR Dashboard</h1>
    <p>Добро пожаловать, {{ user.username }}!</p>
    <div class="dashboard-grid">
        <div class="dashboard-card">
            <h2>Поиск резюме</h2>
            <p>Поиск кандидатов по ключевым словам и городу</p>
            <a href="/search">Начать поиск</a>
        </div>
        <div class="dashboard-card">
            <h2>Кандидаты</h2>
            <p>Просмотр и управление кандидатами</p>
            <a href="/candidates">Список кандидатов</a>
        </div>
        <div class="dashboard-card">
            <h2>История поиска</h2>
            <p>Просмотр истории поисковых запросов</p>
            <a href="/history">Просмотреть историю</a>
        </div>
    </div>
</body>
</html>
